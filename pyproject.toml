[tool.poetry]
name = "algorithmic-trading-ml"
version = "0.1.0"
description = "Machine Learning-driven Algorithmic Trading Strategy System"
authors = ["Jack Massey <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Core Data & ML
pandas = "^2.1.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
xgboost = "^2.0.0"
lightgbm = "^4.1.0"
tensorflow = "^2.17.0"
optuna = "^3.4.0"
mlflow = "^2.8.0"

# Finance & Technical Analysis
alpha-vantage = "^2.3.1"
TA-Lib = "^0.4.28"
pandas-datareader = "^0.10.0"
newsapi-python = "^0.2.6"

# Database & Caching
psycopg2-binary = "^2.9.7"
sqlalchemy = "^2.0.20"
redis = "^5.0.0"
alembic = "^1.12.0"

# Web & API
fastapi = "^0.103.0"
uvicorn = "^0.23.0"
httpx = "^0.25.0"
pydantic = "^2.4.0"
streamlit = "^1.27.0"

# Visualization
plotly = "^5.16.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"

# Utilities
python-dotenv = "^1.0.0"
click = "^8.1.0"
loguru = "^0.7.0"
pydantic-settings = "^2.0.0"
tenacity = "^8.2.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.11.0"
pytest-benchmark = "^4.0.0"

# Code Quality
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
bandit = "^1.7.5"
pre-commit = "^3.4.0"

# Documentation
sphinx = "^7.1.0"
sphinx-rtd-theme = "^1.3.0"

# Development Tools
jupyter = "^1.0.0"
ipykernel = "^6.25.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
